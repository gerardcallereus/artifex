<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 480" width="100%" height="auto">
  <style>
    .header-sa { fill: #dc2626; }
    .card-sa-main { fill: #fef2f2; stroke: #ef4444; stroke-width: 3.5px; }
    .card-sa-sec { fill: #ffffff; stroke: #fca5a5; stroke-width: 3px; }
    
    .header-sccl { fill: #15803d; }
    .card-sccl-main { fill: #f0fdf4; stroke: #16a34a; stroke-width: 3.5px; }
    .gold-sccl { fill: #dcfce7; stroke: #22c55e; stroke-width: 3.5px; }

    .header-title { font-family: 'Lato', system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 900; fill: #ffffff; text-anchor: middle; }
    .header-sub { font-family: 'Lato', system-ui, -apple-system, sans-serif; font-size: 17px; font-weight: 800; fill: #fee2e2; text-anchor: middle; }
    .header-sub-green { font-family: 'Lato', system-ui, -apple-system, sans-serif; font-size: 17px; font-weight: 800; fill: #dcfce7; text-anchor: middle; }
    
    .bold-red { font-family: 'Lato', system-ui, -apple-system, sans-serif; font-size: 21px; font-weight: 900; fill: #991b1b; }
    .sub-red { font-family: 'Lato', system-ui, -apple-system, sans-serif; font-size: 19px; font-weight: 700; fill: #7f1d1d; }
    
    .bold-gray { font-family: 'Lato', system-ui, -apple-system, sans-serif; font-size: 21px; font-weight: 900; fill: #1f2937; }
    .sub-gray { font-family: 'Lato', system-ui, -apple-system, sans-serif; font-size: 19px; font-weight: 700; fill: #374151; }
    
    .bold-green { font-family: 'Lato', system-ui, -apple-system, sans-serif; font-size: 21px; font-weight: 900; fill: #166534; }
    .sub-green { font-family: 'Lato', system-ui, -apple-system, sans-serif; font-size: 19px; font-weight: 700; fill: #14532d; }
    
    .gold-title { font-family: 'Lato', system-ui, -apple-system, sans-serif; font-size: 22.5px; font-weight: 900; fill: #15803d; text-anchor: middle; }
    .gold-sub { font-family: 'Lato', system-ui, -apple-system, sans-serif; font-size: 19px; font-weight: 800; fill: #166534; text-anchor: middle; }
  </style>

  <!-- COLUMN 1: EMPRESA MERCANTIL TRADICIONAL (SA) -->
  <!-- Header Bar -->
  <rect x="6" y="6" width="236" height="64" rx="10" class="header-sa" />
  <text x="124" y="32" class="header-title">EMPRESA MERCANTIL</text>
  <text x="124" y="55" class="header-sub">(Multinacional SA)</text>
  
  <!-- Card 1: Majoritari -->
  <rect x="6" y="82" width="236" height="145" rx="12" class="card-sa-main" />
  <text x="16" y="115" class="bold-red">🔴 Accionista Majoritari</text>
  <text x="16" y="142" class="bold-red">(51% de les accions):</text>
  <text x="16" y="178" class="sub-red">Decideix ell sol directament.</text>
  <text x="16" y="206" class="sub-red">El seu vot val el 51% total.</text>
  
  <!-- Arrow -->
  <path d="M 124 227 L 124 252" stroke="#dc2626" stroke-width="4.5" />
  <polygon points="124,260 115,243 133,243" fill="#dc2626" />
  
  <!-- Card 2: Operaris -->
  <rect x="6" y="262" width="236" height="205" rx="12" class="card-sa-sec" />
  <text x="16" y="298" class="bold-gray">⚪ Treballadors i operaris</text>
  <text x="16" y="325" class="bold-gray">de la fàbrica:</text>
  <text x="16" y="361" class="sub-gray">No tenen cap vot ni decisió.</text>
  <text x="16" y="389" class="sub-gray">Poder de vot: 0% total.</text>
  <text x="16" y="417" class="sub-gray">Només obeeixen ordres.</text>
  
  <!-- COLUMN 2: COOPERATIVA SOCIAL (La Fageda SCCL) -->
  <!-- Header Bar -->
  <rect x="258" y="6" width="236" height="64" rx="10" class="header-sccl" />
  <text x="376" y="32" class="header-title">COOPERATIVA SOCIAL</text>
  <text x="376" y="55" class="header-sub-green">(La Fageda SCCL)</text>
  
  <!-- Card 1: Assemblea -->
  <rect x="258" y="82" width="236" height="145" rx="12" class="card-sccl-main" />
  <text x="268" y="115" class="bold-green">🟢 ASSEMBLEA GENERAL</text>
  <text x="268" y="142" class="bold-green">DE SOCIS TREBALLADORS:</text>
  <text x="268" y="178" class="sub-green">Tots els socis i treballadors</text>
  <text x="268" y="206" class="sub-green">tenen veu i vot a les reunions.</text>
  
  <!-- Arrow -->
  <path d="M 376 227 L 376 252" stroke="#16a34a" stroke-width="4.5" />
  <polygon points="376,260 367,243 385,243" fill="#16a34a" />
  
  <!-- Card 2: 1 Persona = 1 Vot -->
  <rect x="258" y="262" width="236" height="205" rx="12" class="gold-sccl" />
  <text x="376" y="298" class="gold-title">⭐ REGLA D'OR:</text>
  <text x="376" y="326" class="gold-title">1 PERSONA = 1 VOT</text>
  <text x="376" y="363" class="gold-sub">El vot del Director General</text>
  <text x="376" y="391" class="gold-sub">val EXACTAMENT EL MATEIX</text>
  <text x="376" y="419" class="gold-sub">que el d'un operari de neteja.</text>
</svg>
