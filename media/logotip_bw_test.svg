<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="100%" height="auto">
  <style>
    .card-bw { fill: #f9fafb; stroke: #374151; stroke-width: 3px; }
    .title-bw { font-family: 'Lato', system-ui, sans-serif; font-size: 19px; font-weight: 900; fill: #111827; text-anchor: middle; }
    .txt-body { font-family: 'Lato', system-ui, sans-serif; font-size: 15px; font-weight: 600; fill: #1f2937; }
    .txt-sub { font-family: 'Lato', system-ui, sans-serif; font-size: 14px; font-weight: 500; fill: #4b5563; }
  </style>

  <!-- STEP 1: Full color design -->
  <rect x="15" y="15" width="320" height="270" rx="14" class="card-bw" />
  <text x="175" y="48" class="title-bw">🎨 1. Versió en Color de la Marca</text>
  
  <g transform="translate(115, 75)">
    <polygon points="60,10 110,90 10,90" fill="#c12872" />
    <circle cx="60" cy="55" r="22" fill="#f59e0b" />
    <text x="60" y="115" font-family="'Lato', sans-serif" font-size="20" font-weight="900" fill="#1e3a8a" text-anchor="middle">ARTÍFEX</text>
  </g>
  
  <text x="35" y="222" class="txt-body">• Colors vius i atractius (Fúcsia, Taronja, Blau).</text>
  <text x="35" y="248" class="txt-sub">• Es veu excel·lent en pantalla i a color.</text>

  <!-- STEP 2: Monochromatic / B&W test -->
  <rect x="365" y="15" width="320" height="270" rx="14" class="card-bw" />
  <text x="525" y="48" class="title-bw">⬛ 2. Prova en Blanc i Negre (1 Color)</text>
  
  <g transform="translate(465, 75)">
    <polygon points="60,10 110,90 10,90" fill="#000000" />
    <circle cx="60" cy="55" r="22" fill="#ffffff" stroke="#000000" stroke-width="4" />
    <text x="60" y="115" font-family="'Lato', sans-serif" font-size="20" font-weight="900" fill="#000000" text-anchor="middle">ARTÍFEX</text>
  </g>
  
  <text x="385" y="222" class="txt-body">• Sense colors, el logo manté 100% la força.</text>
  <text x="385" y="248" class="txt-sub">• Funciona per gravat làser, encuny o fotocòpia.</text>
</svg>
