<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" width="100%" height="auto">
  <style>
    .card-correct { fill: #f0fdf4; stroke: #16a34a; stroke-width: 3px; }
    .card-wrong { fill: #fef2f2; stroke: #dc2626; stroke-width: 3px; }
    .title-green { font-family: 'Lato', system-ui, sans-serif; font-size: 19px; font-weight: 900; fill: #15803d; text-anchor: middle; }
    .title-red { font-family: 'Lato', system-ui, sans-serif; font-size: 19px; font-weight: 900; fill: #991b1b; text-anchor: middle; }
    .txt-body { font-family: 'Lato', system-ui, sans-serif; font-size: 15px; font-weight: 600; fill: #374151; }
    .txt-sub { font-family: 'Lato', system-ui, sans-serif; font-size: 14px; font-weight: 500; fill: #6b7280; }
  </style>

  <!-- CORRECT LOGO (Passes Scissors Test) -->
  <rect x="15" y="15" width="320" height="290" rx="14" class="card-correct" />
  <text x="175" y="50" class="title-green">✅ PASSA LA PROVA DE LES TISORES</text>
  
  <!-- Icon / Shape: Clean Star/Diamond silhouette -->
  <path d="M 175 75 L 190 115 L 230 115 L 198 140 L 210 180 L 175 155 L 140 180 L 152 140 L 120 115 L 160 115 Z" fill="#16a34a" stroke="#14532d" stroke-width="2" />
  
  <text x="35" y="215" class="txt-body">✂️ Silueta clara, neta i definida.</text>
  <text x="35" y="242" class="txt-sub">• Es pot retallar en un paper amb tisores</text>
  <text x="35" y="265" class="txt-sub">  sense perdre el nom ni la seva forma.</text>
  <text x="35" y="288" class="txt-sub">• Reconeixible a l'instant com a icona.</text>

  <!-- WRONG LOGO (Fails Scissors Test) -->
  <rect x="365" y="15" width="320" height="290" rx="14" class="card-wrong" />
  <text x="525" y="50" class="title-red">❌ SUSPEN LA PROVA DE LES TISORES</text>
  
  <!-- Icon / Shape: Messy gradient lines, tiny dots, complex text inside box -->
  <rect x="445" y="75" width="160" height="100" rx="6" fill="#fca5a5" stroke="#dc2626" stroke-dasharray="4,4" stroke-width="2" />
  <circle cx="475" cy="100" r="8" fill="#991b1b" />
  <circle cx="575" cy="150" r="5" fill="#991b1b" />
  <line x1="455" y1="160" x2="595" y2="90" stroke="#dc2626" stroke-width="1.5" />
  <text x="525" y="130" font-size="11" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Lletres petites + línies primes</text>

  <text x="385" y="215" class="txt-body">⚠️ Massa detalls, degradats i línies primes.</text>
  <text x="385" y="242" class="txt-sub">• Si intentes retallar-ho amb tisores,</text>
  <text x="385" y="265" class="txt-sub">  el dibuix es trenca i queda il·legible.</text>
  <text x="385" y="288" class="txt-sub">• Es fa invisible en mides petites.</text>
</svg>
