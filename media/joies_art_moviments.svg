<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" width="100%" height="auto">
  <rect width="500" height="240" rx="12" fill="#fffbebf7" stroke="#d97706" stroke-width="2" />
  <text x="250" y="32" font-family="'Lato', sans-serif" font-size="16" font-weight="900" fill="#b45309" text-anchor="middle">🎨 3. Art i Moviments Estètics (Bauhaus &amp; Art Nouveau)</text>

  <!-- Bauhaus Abstract Earring 1 -->
  <g transform="translate(100, 60)">
    <circle cx="50" cy="35" r="28" fill="#f59e0b" stroke="#92400e" stroke-width="2.5" />
    <rect x="25" y="60" width="50" height="50" fill="#c12872" stroke="#7f1146" stroke-width="2.5" />
    <polygon points="50,115 80,140 20,140" fill="#1e3a8a" stroke="#1e1b4b" stroke-width="2" />
    <circle cx="50" cy="5" r="4" fill="#92400e" />
  </g>

  <!-- Art Nouveau Curvy Earring 2 -->
  <g transform="translate(300, 60)">
    <path d="M 50 15 C 20 40, 80 70, 40 100 C 20 120, 80 135, 50 145" fill="none" stroke="#d97706" stroke-width="4" stroke-linecap="round" />
    <circle cx="40" cy="100" r="10" fill="#f59e0b" />
    <circle cx="50" cy="145" r="6" fill="#b45309" />
    <circle cx="50" cy="5" r="4" fill="#b45309" />
  </g>

  <text x="250" y="215" font-family="'Lato', sans-serif" font-size="13" font-weight="700" fill="#78350f" text-anchor="middle">Joieria inspirada en l'avantguarda artística, formes abstractes i corbes elegants</text>
</svg>
